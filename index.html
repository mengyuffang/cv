<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>方孟榆 · 个人简历</title>
  <meta name="description" content="方孟榆 — 手绘风个人作品集简历" />
  <style>
    :root {
      --paper:#f5f3ee;
      --ink:#111111;
      --muted:#4e4e4e;
      --line:#171717;
      --shadow:rgba(17,17,17,0.12);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:flex;justify-content:center;align-items:center;
      padding:24px;background:#e7e5e1;
      font-family:"Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color:var(--ink);overflow:hidden;
    }

    .board-shell{
      width:min(96vw,1500px);height:min(92vh,850px);position:relative;
      background:var(--paper);border:10px solid var(--line);overflow:hidden;
      box-shadow:0 18px 36px rgba(0,0,0,0.12);
    }

    .top-row{
      position:absolute;top:18px;left:22px;right:18px;
      display:flex;justify-content:space-between;align-items:flex-start;gap:22px;z-index:3;
    }

    .top-left{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}

    .little-box{min-width:180px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink)}
    .little-box .label{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500}
    .little-box .label .mark{font-size:18px;font-weight:700;transform:rotate(8deg)}
    .little-box .value{font-size:18px;font-weight:500;margin-left:2px}

    .toolbar{
      display:flex;align-items:center;gap:12px;min-width:320px;height:42px;padding:8px 14px;
      border:2px solid rgba(17,17,17,0.82);background:rgba(255,255,255,0.4);border-radius:8px;
      box-shadow:inset 0 0 0 1px rgba(17,17,17,0.1);font-size:13px;color:var(--muted);
    }
    .toolbar .pill{
      display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:2px solid var(--ink);
      border-radius:4px;background:rgba(255,255,255,0.25);font-size:11px;
    }
    .toolbar .input-txt{
      flex:1;text-align:center;font-size:15px;letter-spacing:0.04em;transform:translateY(-1px);
      font-family:"Segoe Print", "Bradley Hand", cursive;
    }

    .scribble-layer{position:absolute;inset:0;z-index:1;pointer-events:none}

    .doodle-note{
      position:absolute;display:flex;align-items:center;justify-content:center;padding:10px 16px;min-width:110px;height:40px;
      border:2px solid rgba(17,17,17,0.8);background:rgba(255,255,255,0.5);border-radius:14px;
      box-shadow:0 8px 16px rgba(0,0,0,0.04);color:var(--ink);font-size:14px;font-weight:500;
      pointer-events:auto;cursor:pointer;user-select:none;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
      font-family:"Segoe Print", "Bradley Hand", cursive;
    }
    .doodle-note.medium{min-width:140px;height:48px;padding:12px 18px}
    .doodle-note.big{min-width:170px;height:54px;padding:18px 22px}
    .doodle-note:hover,.doodle-note:focus-visible,.doodle-note.active{
      transform:translateY(-4px) rotate(0deg) scale(1.03);background:rgba(255,255,255,0.85);
      box-shadow:0 16px 26px rgba(0,0,0,0.08);outline:none;
    }

    .tag-brand{left:120px;top:224px;transform:rotate(-8deg)}
    .tag-ui{left:290px;top:350px;transform:rotate(12deg)}
    .tag-pack{left:440px;top:230px;transform:rotate(-6deg)}
    .tag-ill{left:600px;top:440px;transform:rotate(8deg)}
    .tag-visual{left:780px;top:330px;transform:rotate(-10deg)}
    .tag-motion{left:1000px;top:420px;transform:rotate(9deg)}

    .focus-panel{
      position:absolute;right:110px;top:100px;width:240px;height:440px;display:flex;flex-direction:column;
      justify-content:flex-start;align-items:flex-start;z-index:2;font-family:"Segoe Print","Bradley Hand",cursive;
    }
    .focus-panel .vertical-word{
      writing-mode:vertical-rl;text-orientation:mixed;position:absolute;right:-34px;top:130px;
      font-size:72px;line-height:1;letter-spacing:10px;font-weight:700;color:var(--ink);pointer-events:none;
      transform:translateY(20px);
    }

    .focus-card{
      width:100%;background:rgba(255,255,255,0.16);border:2px solid rgba(17,17,17,0.8);border-radius:18px;
      padding:18px 18px 16px;position:relative;box-shadow:0 20px 26px rgba(17,17,17,0.04);
    }
    .focus-card::before{content:"";position:absolute;right:-18px;top:32px;width:42px;height:2px;background:var(--ink);transform:rotate(30deg)}
    .focus-card .eyebrow{font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-family:"Helvetica Neue", Arial, sans-serif}
    .focus-card h2{margin:0 0 8px;font-size:28px;line-height:1.1;font-weight:700}
    .focus-card p{margin:0 0 12px;font-size:15px;line-height:1.5;color:var(--muted);font-family:"Helvetica Neue", Arial, sans-serif}
    .focus-card ul{margin:0;padding-left:18px;color:var(--ink);font-size:15px;line-height:1.6;font-family:"Helvetica Neue", Arial, sans-serif}

    .signature{
      position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:0.04em;white-space:nowrap;
      font-family:"Segoe Print", "Bradley Hand", cursive;
    }
    .signature em{font-style:normal;font-family:"Helvetica Neue", Arial, sans-serif;font-weight:700}

    .paper-scribble{
      position:absolute;border:2px solid rgba(17,17,17,0.8);background:rgba(255,255,255,0.26);border-radius:18px;
      transform:rotate(-10deg);box-shadow:0 10px 20px rgba(0,0,0,0.05);
    }
    .paper-scribble.one{width:116px;height:86px;left:318px;top:420px}
    .paper-scribble.two{width:86px;height:80px;left:550px;top:120px;transform:rotate(14deg)}
    .paper-scribble.three{width:90px;height:78px;left:750px;top:520px;transform:rotate(-16deg)}
    .paper-scribble.four{width:106px;height:82px;left:980px;top:260px;transform:rotate(12deg)}
    .paper-scribble::before{content:"";position:absolute;inset:12px 12px auto auto;width:52%;height:30%;border:2px solid rgba(17,17,17,0.8);border-radius:12px;background:rgba(255,255,255,0.08)}

    .cloud{
      position:absolute;border:2px solid rgba(17,17,17,0.8);background:rgba(255,255,255,0.28);border-radius:999px;padding:10px 18px;font-size:18px;
      box-shadow:0 8px 18px rgba(17,17,17,0.05);font-family:"Segoe Print", "Bradley Hand", cursive;
    }
    .cloud.one{left:620px;top:310px;transform:rotate(-5deg)}
    .cloud.two{left:802px;top:420px;transform:rotate(6deg)}
    .cloud.three{left:500px;top:550px;transform:rotate(-8deg)}

    @media (max-width:1024px){
      body{padding:18px;overflow:auto}
      .board-shell{width:100%;height:auto;min-height:100vh}
      .focus-panel{position:relative;right:auto;top:auto;width:100%;max-width:480px;margin:160px auto 80px}
      .focus-panel .vertical-word{display:none}
      .top-row{position:relative;top:auto;left:auto;right:auto;padding:18px 18px 0 18px;flex-wrap:wrap}
      .toolbar{min-width:220px;width:100%}
      .doodle-note{position:relative;left:auto !important;top:auto !important;display:inline-flex;margin:6px}
      .scribble-layer{position:relative;display:flex;flex-wrap:wrap;gap:12px;padding:80px 18px 0}
      .paper-scribble,.cloud{position:relative;left:auto !important;top:auto !important;display:inline-flex;margin:12px}
      .signature{position:relative;bottom:auto;left:auto;transform:none;margin:22px auto 32px;display:block;text-align:center}
    }
  </style>
</head>
<body>
  <div class="board-shell">
    <div class="top-row">
      <div class="top-left">
        <div class="little-box">
          <div class="label"><span>我的专业</span><span class="mark">✎</span></div>
          <div class="value">视觉设计</div>
        </div>
        <div class="little-box">
          <div class="label"><span>申请岗位</span><span class="mark">✎</span></div>
          <div class="value">品牌设计师</div>
        </div>
      </div>

      <div class="toolbar" aria-label="工具栏">
        <span class="pill">◻</span>
        <span class="pill">▣</span>
        <span class="input-txt">How to Create a Personal Portfolio</span>
      </div>
    </div>

    <div class="scribble-layer" aria-label="交互式设计能力标签">
      <button class="doodle-note tag-brand active" data-skill="brand" type="button">品牌设计</button>
      <button class="doodle-note tag-ui" data-skill="ui" type="button">UI / 交互</button>
      <button class="doodle-note tag-pack" data-skill="pack" type="button">包装设计</button>
      <button class="doodle-note medium tag-ill" data-skill="ill" type="button">插画创作</button>
      <button class="doodle-note tag-visual" data-skill="visual" type="button">视觉策划</button>
      <button class="doodle-note medium tag-motion" data-skill="motion" type="button">动态内容</button>

      <div class="paper-scribble one"></div>
      <div class="paper-scribble two"></div>
      <div class="paper-scribble three"></div>
      <div class="paper-scribble four"></div>

      <div class="cloud one">找到你</div>
      <div class="cloud two">I’m fine</div>
      <div class="cloud three">五彩斑斓</div>
    </div>

    <div class="focus-panel" aria-live="polite">
      <div class="focus-card">
        <div class="eyebrow">Featured</div>
        <h2 id="skill-title">品牌设计</h2>
        <p id="skill-summary">从品牌定位到视觉输出，构建清晰、可识别、可持续传播的视觉系统。</p>
        <ul id="skill-list">
          <li>品牌视觉识别与策略</li>
          <li>海报、门店视觉与宣传物料</li>
          <li>统一品牌语气与传播表现</li>
        </ul>
      </div>
      <div class="vertical-word">作品集</div>
    </div>

    <div class="signature"><em>Designer</em> ✦ 求职者：方孟榆</div>
  </div>

  <script>
    const skillMap = {
      brand: {
        title: '品牌设计',
        summary: '从品牌定位到视觉输出，构建清晰、可识别、可持续传播的视觉系统。',
        list: ['品牌视觉识别与策略','海报、门店视觉与宣传物料','统一品牌语气与传播表现']
      },
      ui: {
        title: 'UI / 交互',
        summary: '把信息架构和使用逻辑整理成直观、舒服且容易理解的体验界面。',
        list: ['信息结构与页面布局设计','移动端与小程序交互方案','界面优化与体验迭代']
      },
      pack: {
        title: '包装设计',
        summary: '根据产品特征和品牌风格，将包装转化为更容易被记住的消费体验。',
        list: ['产品包装视觉与结构设计','IP 形象与文化主题包装','实物落地与传播升级']
      },
      ill: {
        title: '插画创作',
        summary: '以手绘、人物和场景表达来增强品牌情绪和故事感，让作品更有辨识度。',
        list: ['原创插画与品牌角色设定','内容配图与活动视觉插画','故事化表达与情绪叙述']
      },
      visual: {
        title: '视觉策划',
        summary: '从传播目的、受众和节点整理内容策略，确保视觉呈现更有冲击力和效率。',
        list: ['专题活动视觉统筹','社媒内容与物料部署','视觉节奏与传播节奏设计']
      },
      motion: {
        title: '动态内容',
        summary: '结合节奏感和动画语言，把静态内容转成更容易吸引注意力的演示内容。',
        list: ['短视频脚本与视觉节奏','活动展示和动态海报','内容制式与品牌动效支持']
      }
    };

    const buttons = document.querySelectorAll('.doodle-note');
    const title = document.getElementById('skill-title');
    const summary = document.getElementById('skill-summary');
    const list = document.getElementById('skill-list');

    function renderSkill(key) {
      const item = skillMap[key];
      if (!item) return;
      title.textContent = item.title;
      summary.textContent = item.summary;
      list.innerHTML = item.list.map(v => `<li>${v}</li>`).join('');
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.skill === key));
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => renderSkill(btn.dataset.skill));
      btn.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          renderSkill(btn.dataset.skill);
        }
      });
    });
  </script>
</body>
</html>
